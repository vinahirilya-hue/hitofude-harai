<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>smoke test</title></head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="planVig"></div>
  <div id="hud">
    <div class="bar hp"><div id="hpFill"></div><span id="hpText"></span></div>
    <div class="bar mana"><div id="manaFill"></div><div id="manaPreview"></div><span id="manaText"></span></div>
    <div id="lvlBadge"></div><div class="bar xp"><div id="xpFill"></div></div><div id="weaponWrap"></div>
    <div id="activeHud"><b id="activeSeal"></b><span id="activeCopy"><b id="activeName"></b><i id="activeStatus"></i></span><em id="activeKey"></em><span id="activeTrack"><i id="activeFill"></i></span></div>
    <div id="skillWrap"></div><div id="fateHud"></div><div id="buildHud"></div>
    <div id="waveText"></div><span id="timeText"></span><div id="threatText"></div>
    <div id="bossWrap"><div id="bossName"></div><div class="bar boss"><div id="bossFill"></div></div></div>
    <div id="killText"></div><div id="jadeText"></div><div id="comboText"></div><div id="hint"></div>
    <div id="formHud"><div id="formKanji"></div><div id="formName"></div><div id="formDetail"></div><div id="formProgress"></div></div>
    <div id="itemHud"><div id="itemHudHead"></div><span id="itemHudCount"></span><div id="itemHudGrid"></div><div id="itemHudDetail"></div></div>
  </div>
  <div id="hurtVig"></div><div id="flash"></div><div id="rating"></div><div id="banner"></div>
  <div id="title"><div id="btnStart"></div><div id="btnCodex"></div><input id="volSlider"><input id="volSlider2"><select id="qualitySel"></select><div id="bestLine"></div></div>
  <div id="fateSelect" class="hidden"><button id="btnFateBack"></button><div id="fateChoices"></div></div>
  <div id="encyclopedia" class="hidden"><button id="btnCodexClose"></button><nav id="codexTabs"></nav><main id="codexBody"></main></div>
  <div id="levelup"><div id="cards"></div></div>
  <div id="shop" class="hidden"><div id="shopWaveText"></div><div id="shopJade"></div><div id="shopBag"></div><div id="shopFreeItems"></div><div id="shopBaseItems"></div><div id="shopItems"></div><div id="btnReroll"><span id="rerollCost"></span></div><div id="btnNextWave"></div></div>
  <div id="weaponSelect" class="hidden"><div id="weaponCurrentSlots"></div><div id="weaponChoices"></div><div id="weaponSelectTip"></div></div>
  <div id="itemReward" class="hidden"><div id="itemRewardChoices"></div></div>
  <div id="gameover"><div id="overStats"></div><div id="btnRetry"></div></div>
  <div id="victory"><div id="winStats"></div><div id="btnAgain"></div></div>
  <div id="pause"><div id="btnResume"></div><div id="btnQuit"></div></div>
</div>

<script src="js/util.js"></script>
<script src="js/assets.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/fx.js"></script>
<script src="js/scene.js"></script>
<script src="js/entities.js"></script>
<script src="js/upgrades.js"></script>
<script src="js/weapons.js"></script>
<script src="js/progression.js"></script>
<script src="js/encyclopedia.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    // 停掉 rAF 循环，改全手动驱动
    window.requestAnimationFrame = () => 0;
    const log = [];
    window.onerror = (m, s, l) => { log.push('ONERROR: ' + m + ' @ ' + (s || '').split('/').pop() + ':' + l); };
    const step = n => { for (let i = 0; i < n; i++) { G.game.update(1 / 60); G.Input.endFrame(); } };
    const assert = (ok, msg) => { if (!ok) throw new Error('ASSERT: ' + msg); };
    const skillTotal = game => G.SKILL_ORDER.reduce((sum, id) => sum + (game.skills[id] || 0), 0);
    try {
      const g = G.game;
      const cv = document.getElementById('cv');
      const ctx = cv.getContext('2d');
      const pointMouse = (x, y) => {
        const screen = g.worldToScreen(x, y);
        G.Input.mouse.x = screen.x;
        G.Input.mouse.y = screen.y;
      };
      const codexCounts = G.Encyclopedia.counts();
      assert(codexCounts.fates === 8 && codexCounts.builds === 5 && codexCounts.stages === 9 &&
        codexCounts.weapons === 13 && codexCounts.skills === 17 &&
        codexCounts.upgrades === G.UPGRADES.length + 2 && codexCounts.items === 76 &&
        codexCounts.enemies === 22,
        '图鉴没有收录全部武器、技能、强化、道具或敌人');
      const codexExpected = {
        fates: codexCounts.fates, builds: codexCounts.builds, stages: codexCounts.stages,
        weapons: codexCounts.weapons, skills: codexCounts.skills, upgrades: codexCounts.upgrades,
        items: codexCounts.items, enemies: codexCounts.enemies
      };
      G.Encyclopedia.open('weapons');
      assert(G.Encyclopedia.isOpen() && document.getElementById('title').classList.contains('hidden'),
        '主菜单图鉴没有正常打开');
      for (const id of Object.keys(codexExpected)) {
        G.Encyclopedia.render(id);
        assert(document.querySelectorAll('#codexBody .codexCard').length === codexExpected[id] &&
          document.querySelector('[data-codex-tab="' + id + '"].active'),
          '图鉴分类“' + id + '”的分组或数量错误');
      }
      G.Encyclopedia.render('skills');
      assert(G.SKILL_ORDER.every(id => !!G.SKILLS[id].trigger) &&
        G.ACTIVE_SKILL_ORDER.every(id => !!G.ACTIVE_SKILLS[id].cooldown) &&
        document.querySelectorAll('#codexBody .codexTrigger').length === G.SKILL_ORDER.length + G.ACTIVE_SKILL_ORDER.length,
        '自动技能或主动术式没有在图鉴中显示明确触发条件');
      G.Encyclopedia.render('enemies');
      assert(document.querySelectorAll('#codexBody .codexGroup').length === 4,
        '普通怪、精英怪、Boss 和战场法则没有在妖怪图鉴中分组');
      G.Encyclopedia.close();
      assert(!G.Encyclopedia.isOpen() && !document.getElementById('title').classList.contains('hidden'),
        '图鉴关闭后没有返回主菜单');
      log.push('[0] 万象图鉴通过 命格=' + codexCounts.fates + ' 流派=' + codexCounts.builds + ' 祟章=' + codexCounts.stages +
        ' 神兵=' + codexCounts.weapons + ' 秘法=' + codexCounts.skills +
        ' 加护=' + codexCounts.upgrades + ' 道具=' + codexCounts.items + ' 妖怪=' + codexCounts.enemies);
      g.openFateSelect();
      assert(g.state === 'fate' && document.querySelectorAll('#fateChoices .fateCard').length === 8 &&
        document.getElementById('title').classList.contains('hidden'),
        '开局命格选择界面没有显示全部八种命格');
      g.closeFateSelect();
      assert(g.state === 'title' && !document.getElementById('title').classList.contains('hidden'),
        '命格选择返回主菜单失败');

      const baseStats = G.computeStats({});
      g.start('dancer');
      assert(g.player.stats.dmg < baseStats.dmg && g.fateActiveCooldownMul() === 0.65,
        '神乐舞姬没有降低主祓除伤害或缩短主动术调息');
      g.skills = Object.fromEntries(G.SKILL_ORDER.slice(0, 4).map(id => [id, 1]));
      const skillLevelsBeforeCap = skillTotal(g);
      g.collectSkillDrop(G.SKILL_ORDER[4]);
      assert(g.skillSlotLimit() === 4 && g.skillSlotCount() === 4 &&
        skillTotal(g) === skillLevelsBeforeCap + 1 && !g.skills[G.SKILL_ORDER[4]],
        '普通命格满四个秘法槽后没有改为升级已装备秘法');

      g.start('shura');
      assert(g.player.maxHp === Math.round(baseStats.maxHp * 0.55) &&
        g.player.stats.dmg > baseStats.dmg * 1.3 && g.player.stats.repeatHits >= 1,
        '修罗命格没有正确交换生命、伤害与重复锁定');

      g.start('offering');
      const offeringBaseItem = G.SHOP_BASE_ITEMS[0];
      assert(G.shopBasePrice(g, offeringBaseItem) === Math.round(offeringBaseItem.baseCost * 0.75) &&
        g.scaledJade(4) === 10 && g.player.stats.dmg < baseStats.dmg,
        '奉纳命格没有降低价格、提高灵玉或削弱直接战力');

      g.start('omagatoki');
      g.player.xp = 0; g.gainXp(4);
      assert(g.player.xp === 5 && g.fate().densityMul === 1.25 &&
        g.fate().eliteIntervalMul < 0.8,
        '逢魔命格没有提高收益、敌势上限或精英频率');

      g.start('moonTide');
      g.player.mana = 0; g.player.state = 'move'; g.player.update(1, g);
      assert(g.player.mana === 0, '月潮命格仍在自然恢复神力');
      g.moonTideT = 0.01; g.updateFate(0.02);
      assert(g.player.mana >= g.player.maxMana * 0.44 && g.moonTideWindow > 2 &&
        g.attackCost() <= Math.ceil(g.player.stats.cost * 0.5),
        '月潮没有周期回灵、开启潮涌或降低祓除消耗');

      g.start('mirror');
      const mirrorTarget = g.spawnEnemy('chaser', g.player.x + 130, g.player.y);
      mirrorTarget.spawnT = 0; mirrorTarget.hp = mirrorTarget.maxHp = 9999;
      const mirrorHp = mirrorTarget.hp;
      for (let i = 0; i < 5; i++) g.onTrajectoryBulletCut(g.player.x, g.player.y);
      assert(g.mirrorShield === 1 && g.mirrorCutCount === 0 && mirrorTarget.hp < mirrorHp,
        '镜心命格没有在五次断弹后生成神镜与返照攻击');

      g.start('bladeless');
      const bladelessDmg = g.player.stats.dmg;
      g.weaponPending = true; g.shopPending = false; g.itemRewardPending = false; g.state = 'play';
      g.openWeaponSelect();
      assert(g.weapons.length === 1 && g.bladeMastery === 2 &&
        g.player.stats.dmg > bladelessDmg && document.getElementById('weaponSelect').classList.contains('hidden'),
        '无刀命格没有阻止第二武器并把祟主奖励转化为唯一神兵开眼');

      g.start('attendant');
      assert(g.fateId === 'attendant' && g.skillSlotLimit() === 6 && g.skillSlotCount() === 1,
        '百鬼侍从没有获得六个秘法槽或开局随机秘法');
      log.push('[0a] 八命格通过 百鬼/神乐/修罗/奉纳/无刀/逢魔/月潮/镜心・秘法四槽');
      g.player.maxHp = g.player.hp = 99999; // 防测试途中死亡
      step(180);
      assert(g.wave === 1 && g.state === 'play' && g.enemies.length > 0, '首关未正常运行');
      assert(G.WORLD_W > G.W && G.WORLD_H > G.H && g.camera.zoom < 1, '大地图或缩放镜头没有启用');
      assert(G.getWave(1).spawnInterval === 1.25 && G.getWave(1).maxEnemies === 42 &&
        G.getWave(1).squadMin === 3 && G.getWave(1).squadMax === 5,
        '首关小队刷新或提高后的出怪量没有载入');
      assert(G.WAVE_CHAPTERS.every(chapter => !('hint' in chapter)),
        '关卡开场仍保留了指导玩家操作的攻略文案');
      assert(g.enemies.every(e => G.util.fieldContains(e.x, e.y, e.r + 10)),
        '自然刷新的敌人越出了庭院战场');
      assert(G.SHOP_RELICS.length === 66 && G.SHOP_RELICS.filter(x => x.mechanic).length === 27 &&
        G.SHOP_RELICS.filter(x => x.reqWeapon).length === 7 &&
        G.SHOP_RELICS.filter(x => x.reqTwoWeapons).length === 1 &&
        G.SHOP_RELICS.filter(x => x.activeSkill).length === 5,
        '新增技能珍品、神兵专属珍品或主动术契没有载入');
      const superPurgeRelic = G.SHOP_RELICS.find(x => x.id === 'superPurgeSeal');
      assert(superPurgeRelic && superPurgeRelic.rar === 2 && superPurgeRelic.max === 1,
        '超祓没有改为独立的高级珍品');
      g.jadeBonusCarry = 0;
      assert(g.scaledJade(1) === 2 && g.scaledJade(4) === 8, '普通怪与精英灵玉掉落量没有翻倍');
      pointMouse(g.player.x + 80, g.player.y - 50);
      const pointerProbe = g.pointerWorld();
      assert(Math.abs(pointerProbe.x - g.player.x - 80) < 0.01 && Math.abs(pointerProbe.y - g.player.y + 50) < 0.01,
        '屏幕坐标没有正确换算为世界坐标');
      const cameraProbeX = g.camera.x;
      g.player.x += 220;
      g.updateCamera(0.5);
      assert(g.camera.x > cameraProbeX + 50, '角色移动时背景镜头没有跟随');
      g.player.x = G.WORLD_W / 2;
      g.updateCamera(0, true);
      const nativeRandom = Math.random;
      const spawnRolls = [0.25, 0.7];
      Math.random = () => spawnRolls.length ? spawnRolls.shift() : 0.5;
      const fieldSpawn = g.spawnEnemy('chaser');
      Math.random = nativeRandom;
      assert(G.util.fieldContains(fieldSpawn.x, fieldSpawn.y, fieldSpawn.r + 10) &&
        fieldSpawn.y > G.FIELD.cy,
        '敌人没有在整个庭院内刷新，或落进了天空远景');
      g.enemies.splice(g.enemies.indexOf(fieldSpawn), 1);
      const skySpawn = g.spawnEnemy('chaser', G.FIELD.cx, 0);
      assert(G.util.fieldContains(skySpawn.x, skySpawn.y, skySpawn.r + 10) &&
        skySpawn.y >= G.FIELD.cy - G.FIELD.ry,
        '指定坐标生成的敌人仍能出现在天空');
      g.enemies.splice(g.enemies.indexOf(skySpawn), 1);
      g.player.x = G.FIELD.cx; g.player.y = 0;
      g.player.update(0, g);
      assert(G.util.fieldContains(g.player.x, g.player.y, g.player.r + 18),
        '玩家仍能移动到庭院之外');
      g.player.x = G.FIELD.cx; g.player.y = G.FIELD.cy;
      const squadProbe = g.spawnSquad(5, false);
      assert(squadProbe.length === 5 && new Set(squadProbe.map(e => e.squadId)).size === 1 &&
        squadProbe.every(e => G.util.dist(e.x, e.y, squadProbe[0].x, squadProbe[0].y) < 130),
        '敌人没有按紧凑小队编成刷新');
      g.enemies = g.enemies.filter(e => !squadProbe.includes(e));
      assert([5, 10, 15, 20].every(n => G.getWave(n).boss && G.getWave(n).duration === 90) &&
        [1, 4].every(n => G.getWave(n).duration === 30) &&
        [6, 9].every(n => G.getWave(n).duration === 40) &&
        [11, 14].every(n => G.getWave(n).duration === 50) &&
        [16, 19].every(n => G.getWave(n).duration === 60),
        'Boss 90 秒或普通关分段时长配置错误');
      assert(G.WAVE_CHAPTERS.length === 4 && G.WAVE_TRIALS.length === 5 &&
        [1, 6, 11, 16].map(n => G.getWave(n).chapterId).join(',') ===
          'shadowHunt,curseRain,bindingGrove,evernight' &&
        [1, 2, 3, 4, 5].map(n => G.getWave(n).trialId).join(',') ===
          'opening,horde,assault,elite,boss' &&
        new Set(G.WAVE_CHAPTERS.map(x => x.formation)).size === 4 &&
        new Set(G.WAVE_CHAPTERS.map(x => x.event)).size === 4,
        '四章主题、五段章内节奏、敌群阵型或战场事件没有载入');
      g.beginWave(6, false); g.enemies = []; g.bullets = []; g.stageEventT = 0;
      g.updateStageEvent(0.02, G.getWave(6), 50);
      assert(g.bullets.length >= 6, '咒雨之庭没有生成可用轨迹斩断的环形来弹');
      g.beginWave(11, false); g.enemies = []; g.soulLinks = [];
      for (let i = 0; i < 4; i++) {
        const e = g.spawnEnemy('chaser', 500 + i * 90, 330); e.spawnT = 0;
      }
      g.stageEventT = 0; g.updateStageEvent(0.02, G.getWave(11), 60);
      assert(g.soulLinks.filter(x => x.active).length === 2,
        '缚阵之森没有把场上敌人结成需要横切的共生赤线');
      g.beginWave(16, false); g.enemies = []; g.stageEventT = 0;
      g.updateStageEvent(0.02, G.getWave(16), 70);
      assert(g.enemies.length >= 4 &&
        g.enemies.some(e => ['splitter','siphon','guardian','binder','chanter'].includes(e.type)),
        '百鬼常暗没有生成高阶异种混成妖潮');
      g.beginWave(1, false); g.player.maxHp = g.player.hp = 99999;
      log.push('[1a] 四章关卡通过 影狩/咒雨/缚阵/常暗');
      assert(G.getWave(20).hpMul > G.getWave(8).hpMul * 2.5 &&
        G.getWave(20).bossHpMul > G.getWave(10).bossHpMul * 2 &&
        G.getWave(20).enemyDamageMul > 2.7 && G.getWave(20).enemySpeedMul > 1.3 &&
        G.getWave(20).projectileSpeedMul > 1.4 && G.getWave(20).enemyAttackRate > 1.35 &&
        G.getWave(20).hurtGrace <= 0.6 && G.getWave(20).postAttackGrace <= 0.11 &&
        G.getWave(20).assaultChance >= 0.47 && G.getWave(20).bossDamageMul >= 2.2 &&
        G.getWave(20).eliteCap === 3 &&
        G.getWave(3).eliteDelay < G.getWave(3).duration,
        '后期生命、伤害、追击、弹幕、近身刷新或受击窗口没有进入分段成长');
      const firstWaveHitsToFall = Math.ceil(100 / Math.round(8 * G.getWave(1).enemyDamageMul));
      const lastWaveFinalDamage = Math.round(8 * G.getWave(20).enemyDamageMul) * 1.35;
      const lastWaveHitsToFall = Math.ceil(100 / lastWaveFinalDamage);
      assert(firstWaveHitsToFall >= 12 && lastWaveHitsToFall <= 4,
        '基础影妖的实际致死次数没有从前期教学余裕收紧到后期高压');
      const newEnemyProbe = [
        new G.Moth(200, 200, 1), new G.Guardian(220, 200, 1), new G.Chanter(240, 200, 1),
        new G.WardenElite(260, 200, 1), new G.ReaperElite(280, 200, 1)
      ];
      assert(newEnemyProbe.map(e => e.type + ':' + (e.eliteKind || '')).join('|') ===
        'moth:|guardian:|chanter:|elite:warden|elite:reaper' &&
        newEnemyProbe[1].shell === 1 && newEnemyProbe[3].auraT > 0 && newEnemyProbe[4].st === 'roam',
        '三种新小怪或两种新精英没有完整载入');
      for (const e of newEnemyProbe) { e.spawnT = 0; e.update(1 / 60, g); e.draw(ctx, g); }
      const ecologyProbe = [
        new G.Splitter(300, 240, 1, false), new G.Siphon(340, 240, 1), new G.Binder(380, 240, 1),
        new G.SummonerElite(420, 240, 1), new G.SealerElite(460, 240, 1)
      ];
      assert(ecologyProbe.map(e => e.type + ':' + (e.eliteKind || '')).join('|') ===
        'splitter:|siphon:|binder:|elite:summoner|elite:sealer' &&
        ecologyProbe[0].splitStage === 1 && ecologyProbe[1].drain === 10 &&
        ecologyProbe[2].projectileDmg === 10 && ecologyProbe[3].summonT > 0 &&
        ecologyProbe[4].sealT > 0 && G.ENEMY_ROSTER.length === 9 && G.ELITE_ROSTER.length === 5,
        '分裂、吸灵、布阵、召唤或封脉单位没有完整载入');
      for (const e of ecologyProbe) { e.spawnT = 0; e.update(1 / 60, g); e.draw(ctx, g); }
      const splitBefore = g.enemies.length;
      const splitParent = new G.Splitter(520, 260, 1, false);
      g.onKill(splitParent);
      const splitChildren = g.enemies.slice(splitBefore);
      assert(splitChildren.length === 2 && splitChildren.every(e => e.type === 'splinter' && e.noLoot),
        '裂面死亡后没有生成两只无额外掉落的碎面');
      g.enemies.splice(splitBefore);
      const manaBeforeDrain = g.player.mana;
      assert(g.drainPlayerMana(9, 500, 240, '测试') === Math.min(9, manaBeforeDrain) &&
        g.player.mana === Math.max(0, manaBeforeDrain - 9),
        '蚀灵与封脉共用的神力损失入口失败');
      g.player.mana = manaBeforeDrain;
      const mechanicEnemyStart = g.enemies.length, mechanicBulletStart = g.bullets.length;
      const siphonMechanic = new G.Siphon(g.player.x + 60, g.player.y, 1);
      siphonMechanic.spawnT = 0; siphonMechanic.chargeT = 0.001;
      siphonMechanic.update(0.01, g);
      const manaAfterSiphon = g.player.mana;
      const binderMechanic = new G.Binder(g.player.x + 260, g.player.y, 1);
      binderMechanic.spawnT = 0; binderMechanic.aim = { x: g.player.x + 160, y: g.player.y };
      binderMechanic.castT = 0.001; binderMechanic.update(0.01, g);
      const summonMechanic = new G.SummonerElite(g.player.x + 300, g.player.y, 1);
      summonMechanic.spawnT = 0; summonMechanic.chargeT = 0.001; summonMechanic.update(0.01, g);
      const sealerMechanic = new G.SealerElite(g.player.x + 120, g.player.y, 1);
      sealerMechanic.spawnT = 0; sealerMechanic.chargeT = 0.001; sealerMechanic.update(0.01, g);
      assert(manaAfterSiphon < manaBeforeDrain && g.bullets.length >= mechanicBulletStart + 7 &&
        g.enemies.length >= mechanicEnemyStart + 3 && g.manaSealT >= 3.4,
        '吸灵脉冲、脚下咒阵、召唤护卫或封脉实战触发失败');
      g.enemies.splice(mechanicEnemyStart); g.bullets.splice(mechanicBulletStart);
      g.player.mana = manaBeforeDrain; g.manaSealT = 0;
      const bossVariants = [1, 2, 3, 4].map(tier => new G.Boss(1, 1, tier));
      assert(bossVariants.map(b => b.variant).join(',') === 'tengu,oni,fox,void' &&
        bossVariants[1].attackPool.includes('quake') &&
        bossVariants[2].attackPool.includes('blink') &&
        bossVariants[3].attackPool.includes('spiral') &&

      g.bullets.push(umbrellaBullet);
      g.hurtPlayer(5, g.player.x - 40, g.player.y);
      assert(umbrellaBullet.dead && g.umbrellaCd === 6 &&
        Math.abs(umbrellaEnemy.kx) + Math.abs(umbrellaEnemy.ky) > 0,
        '退魔朱伞没有在受伤时断弹并击退近敌');

      g.shopRelics = { returnSoulRope: 1 }; g.bullets = [];
      g.paperShield = 0; g.mirrorShield = 0; g.renewalShield = 0; g.comboShield = 0;
      g.lastLifeUsed = false; g.player.state = 'move'; g.player.iTime = 0; g.player.hp = 10;
      const ropeBullet = new G.Bullet(g.player.x + 20, g.player.y, 0, 0, 1);
      g.bullets.push(ropeBullet);
      g.hurtPlayer(999, g.player.x - 40, g.player.y);
      assert(g.player.hp === 1 && g.lastLifeUsed && ropeBullet.dead,
        '返魂结绳没有在本关第一次致命伤时保留一命');
      log.push('[10i] 新珍品通过 连祷3/术式1/换装1/主动2/狩猎2/护命2/连斩1 总数=' +
        G.SHOP_RELICS.length);

      // 四档连斩热度、超祓溢出扩散与神祓全轨迹斩光。
      g.enemies = []; g.delayed = []; g.skills = {};
      g.shopRelics = { superPurgeSeal: 1 };
      g.spawnT = 999; g.waveTime = 0;
      assert([5, 6, 10, 15, 20].map(n => g.purgeHeat(n).tier).join(',') === '0,1,2,3,4',
        '小祓/中祓/大祓/神祓的热度阈值不正确');
      const divineHits = [];
      for (let i = 0; i < 20; i++) {
        const e = g.spawnEnemy('chaser', 390 + (i % 10) * 30, 370 + Math.floor(i / 10) * 52);
        e.spawnT = 0; e.hp = 1;
        divineHits.push({ t: e, repeat: 0, ang: 0 });
      }
      const divineOutside = g.spawnEnemy('elite', 1420, 400);
      divineOutside.spawnT = 0; divineOutside.hp = divineOutside.maxHp = 9999;
      const divineOutsideHp = divineOutside.hp;
      g.dash = {
        pts: [{x:320,y:400},{x:1540,y:400}], cum:[0,1220], L:1220,
        weapon:'ritualBlade', weaponDmgMul:1, hits:divineHits
      };
      g.player.state = 'fin'; g.finT = 0; g.pendingPurify = -1;
      g.purify();
      assert(g.lastHeatTier === 4, '20 连斩没有进入神祓热度');
      step(40);
      assert(g.lastSuperPurge > 0, '伤害溢出没有触发超祓扩散');
      assert(divineOutside.hp < divineOutsideHp, '神祓没有沿完整轨迹追加斩光');
      log.push('[10f] 爽感机制通过 小队/超祓=' + g.lastSuperPurge + '/神祓全轨迹');

      g.skills = batchSkills; g.weapons = batchWeapons; g.activeWeaponIndex = batchWeaponIndex;
      g.shopRelics = oldRelics; g.renewalShield = 0; g._itemHud = null; g._weaponHud = '';
      g.enemies = []; g.delayed = []; g.zones = []; g.dash = null; g.player.state = 'move'; g.rebuildStats();

      // 回调后的高峰怪量下同时跑逻辑与 Canvas 绘制，防止新连锁机制引入明显性能回退。
      g.state = 'play'; g.waveTime = 0; g.spawnT = 999; g.player.iTime = 999;
      const pressureTypes = ['chaser','dasher','ranged','moth','splitter','siphon','guardian','binder','chanter',
        'wardenElite','reaperElite','summonerElite','sealerElite'];
      for (let i = 0; i < 144; i++) {
        const e = g.spawnEnemy(pressureTypes[i % pressureTypes.length],
          80 + (i % 18) * 120, 100 + Math.floor(i / 18) * 145);
        e.spawnT = 0; e.hp = e.maxHp = Math.max(e.maxHp, 999);
      }
      const testCtx = document.getElementById('cv').getContext('2d');
      for (let i = 0; i < 120; i++) {
        g.update(1 / 60); g.draw(testCtx); G.Input.endFrame();
      }
      assert(g.enemies.filter(e => !e.dead).length >= 132 && g.state === 'play',
        '144怪×120帧逻辑与绘制压力回归失败');
      log.push('[10d] 144怪×120帧逻辑与 Canvas 绘制压力通过');
      g.enemies = []; g.bullets = []; g.zones = []; g.foxfires = []; g.delayed = [];
      g.player.iTime = 1; g.spawnT = 0;

      // 普通关结束 → 商店 → 下一关
      g.gems = []; g.pickups = []; g.pendingLevels = 0;
      g.waveTime = g.waveDuration;
      step(2); step(100);
      assert(g.state === 'shop' && g.shopStock.length === 4, '关后商店没有打开');
      log.push('[11] 关后 state=' + g.state + ' shopOffers=' + g.shopStock.length);
      g.jade = 500; g.renderShop();
      g.player.hp = Math.max(1, g.player.maxHp - 50);
      g.claimShopFree(0);
      assert(g.shopFreeClaimed && g.shopFreeChoice === 'freeHeal' && g.player.hp > g.player.maxHp - 50, '免费四选一失败');
      const baseItem = G.SHOP_BASE_ITEMS.find(x => (g.owned[x.effect.id] || 0) < G.UPG_MAP[x.effect.id].max);
      const baseIndex = G.SHOP_BASE_ITEMS.indexOf(baseItem);
      const baseLevel = g.owned[baseItem.effect.id] || 0;
      const basePrice = G.shopBasePrice(g, baseItem);
      g.buyShopBase(baseIndex);
      assert((g.owned[baseItem.effect.id] || 0) === baseLevel + 1 && G.shopBasePrice(g, baseItem) > basePrice, '固定商品购买或涨价失败');
      const jadeBeforeBuy = g.jade;
      const relicOfferIndex = Math.max(0, g.shopStock.findIndex(x => !x.item.activeSkill));
      const boughtId = g.shopStock[relicOfferIndex].item.id;
      const boughtBefore = g.shopRelics[boughtId] || 0;
      g.buyShopItem(relicOfferIndex);
      assert(g.jade < jadeBeforeBuy && g.shopStock[relicOfferIndex].sold, '商品购买失败');
      const jadeBeforeSell = g.jade;
      assert(g.sellShopItem(boughtId) && g.jade > jadeBeforeSell && (g.shopRelics[boughtId] || 0) === boughtBefore,
        '珍品返奉出售失败');
      const activeContract = G.SHOP_RELIC_MAP.active_shockwave;
      const activeRelicBefore = g.shopRelics[activeContract.id] || 0;
      g.shopStock[0] = { item: activeContract, price: G.shopRelicPrice(g, activeContract), sold: false };
      g.buyShopItem(0);
      assert(g.activeSkillId === 'shockwave' && g.shopStock[0].sold &&
        (g.shopRelics[activeContract.id] || 0) === activeRelicBefore,
        '主动术契没有替换右键主动槽，或错误进入了珍品行囊');
      g.rerollShop();
      assert(g.shopStock.length === 4 && g.shopStock.some(x => x.item.flow), '流派珍品保底或刷新失败');
      log.push('[12] 三段商店通过 jade=' + g.jade + ' rerolls=' + g.shopRerolls + ' flow=' + g.shopStock.filter(x => x.item.flow).length);
      g.player.mana = 17;
      g.nextWavePaper = 1;
      g.leaveShop();
      assert(g.wave === 2 && g.state === 'play' && g.player.mana === 17 && g.paperShield === 1, '商店离开、跨关资源或替身纸人失败');
      g.player.iTime = 0;
      const shieldHp = g.player.hp;
      g.hurtPlayer(20, g.player.x + 10, g.player.y);
      assert(g.player.hp === shieldHp && g.paperShield === 0, '替身纸人没有抵挡伤害');
      log.push('[13] 下一关 wave=' + g.wave + ' duration=' + g.waveDuration + ' state=' + g.state);

      // 第五关 Boss：必掉技能，并在结算后进入商店
      g.beginWave(5, false); step(2);
      assert(!!g.boss, '第五关 Boss 没有登场');
      log.push('[14] Boss登场=' + !!g.boss + ' hp=' + (g.boss ? g.boss.hp : 0));
      const bossSkillBefore = skillTotal(g);
      g.waveTime = g.waveDuration;
      // 回归：Boss 作为小祓/中祓的一员被多目标攻击收尾时，不得在 purify 中途清空轨迹。
      const purgeBoss = g.boss;
      purgeBoss.hp = 1;
      const purgeMobs = [];
      for (let i = 0; i < 5; i++) {
        const e = g.spawnEnemy('chaser', 520 + i * 55, 320);
        e.spawnT = 0; e.hp = 1; purgeMobs.push(e);
      }
      const purgeHits = [{ t: purgeBoss, repeat: 0 }]
        .concat(purgeMobs.map((e, i) => ({ t: e, repeat: 0, ang: i * 0.1 })));
      g.dash = {
        pts: [{ x: 420, y: 320 }, { x: 840, y: 320 }],
        cum: [0, 420], L: 420, hits: purgeHits, weapon: 'ritualBlade',
        weaponDmgMul: 1, pathData: { pts: [{ x: 420, y: 320 }, { x: 840, y: 320 }], cum: [0, 420], L: 420 }
      };
      g.player.state = 'fin'; g.pendingPurify = -1; g.finT = 1;
      g.purify();
      assert(g.bossDefeated && g.waveFinishPending && !!g.dash,
        'Boss 多目标祓除仍在结算途中提前清空轨迹');
      g.player.state = 'move'; g.dash = null;
      step(12); // 先让本次群体祓除的顿帧自然结束，再检查切关。
      assert(g.state === 'waveclear', 'Boss 多目标祓除完成后没有安全进入关卡结算');
      step(100);
      guard = 0;
      while (g.state === 'levelup' && g.pendingLevels > 0 && guard++ < 30) g.chooseCard(0);
      assert(g.state === 'itemreward' && g.itemOffers.length > 0, 'Boss珍品三选一没有打开');
      const bossItemBefore = Object.values(g.shopRelics).reduce((a, b) => a + b, 0);
      g.chooseItemReward(g.itemOffers[0].id);
      assert(g.state === 'weapon' && g.weaponOffers.length > 0 &&
        Object.values(g.shopRelics).reduce((a, b) => a + b, 0) === bossItemBefore + 1,
        'Boss珍品奉纳或神兵流程失败');
      g.chooseWeapon(g.weaponOffers[0]);
      assert(g.state === 'shop' && g.weapons.length === 2 && skillTotal(g) > bossSkillBefore, 'Boss技能、武器或关后流程失败');
      log.push('[15] Boss结算 state=' + g.state + ' skillTotal=' + skillTotal(g) + ' weapons=' + g.weapons.join(',') + ' jade=' + g.jade);

      // 第二十关 Boss 即使未击杀，90 秒到时也应直接结算最终胜利
      g.beginWave(20, false); step(2);
      const timeoutBossHp = g.boss.hp;
      g.waveTime = g.waveDuration;
      step(100);
      assert(g.state === 'win' && !g.bossDefeated && timeoutBossHp > 0,
        '第二十关 Boss 未击杀时没有在90秒后直接胜利');
      log.push('[16] Boss超时胜利 state=' + g.state + ' win可见=' + !document.getElementById('victory').classList.contains('hidden'));

      // 重开 → 送死 → 失败界面
      g.start();
      g.player.maxHp = g.player.hp = 10;
      g.player.iTime = 0;
      g.hurtPlayer(50, g.player.x + 10, g.player.y);
      step(120);
      assert(g.state === 'over', '失败流程没有打开');
      log.push('[17] 失败 state=' + g.state + ' over可见=' + !document.getElementById('gameover').classList.contains('hidden'));
      log.push('DONE');
    } catch (e) {
      log.push('EXCEPTION: ' + e.message);
      log.push((e.stack || '').split('\n').slice(0, 5).join('\n'));
    }
    const pre = document.createElement('pre');
    pre.style.cssText = 'position:fixed;left:10px;top:10px;z-index:99999;background:#fff;color:#111;font:15px/1.7 monospace;padding:14px;white-space:pre-wrap;max-width:900px;';
    pre.textContent = log.join('\n');
    document.body.appendChild(pre);
    document.title = 'TESTDONE';
  }, 500);
});
</script>
</body>
</html>
